server:
  port: ${PORT:8081}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_THREADS:25}
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    max-keep-alive-requests: 100
    connection-timeout: 20s
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}

spring:
  application:
    name: helpinminutes-api

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SPRING_MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT_MS:5000}
          starttls:
            enable: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/him}}
    username: ${DATABASE_USER:him}
    password: ${DATABASE_PASSWORD:him}
    hikari:
      # Keep a small warm pool to avoid connection establish latency
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT_MS:30000}
      max-lifetime: ${HIKARI_MAX_LIFETIME_MS:1800000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT_MS:5000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_MS:2000}
      # In Docker, Postgres can take a few seconds to accept connections. Don't crash-loop.
      initialization-fail-timeout: -1
      data-source-properties:
        sslmode: ${DATABASE_SSLMODE:require}
        ssl: ${DATABASE_SSL:true}
        # Postgres optimization properties
        cachePrepStmts: false
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: false
        reWriteBatchedInserts: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 30000
        default-requeue-rejected: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 60
    connect-retries-interval: 2

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    defaults:
      enabled: ${MANAGEMENT_HEALTH_DEFAULTS_ENABLED:false}
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
    rabbit:
      enabled: ${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}
    db:
      enabled: ${MANAGEMENT_HEALTH_DB_ENABLED:false}

app:
  env: ${APP_ENV:dev}
  jwt:
    # No defaults on purpose: a missing secret must fail startup, never fall back
    # to a publicly-known key. Validated in AppProperties.
    accessSecret: ${JWT_ACCESS_SECRET:}
    refreshSecret: ${JWT_REFRESH_SECRET:}
    accessTtlSeconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refreshTtlSeconds: ${JWT_REFRESH_TTL_SECONDS:2592000}

  otp:
    ttlSeconds: ${OTP_TTL_SECONDS:300}
    # Local development only. Returning the OTP in the API response is an
    # authentication bypass and must stay false in every deployed environment.
    returnOtpInResponse: ${OTP_RETURN_IN_RESPONSE:false}

  matching:
    h3Resolution: ${MATCH_H3_RESOLUTION:9}
    maxKRing: ${MATCH_MAX_KRING:3}
    offerFanout: ${MATCH_OFFER_FANOUT:5}
    helperStaleAfterSeconds: ${MATCH_HELPER_STALE_AFTER_SECONDS:120}
    offerTtlSeconds: ${MATCH_OFFER_TTL_SECONDS:120}

  realtime:
    redisPubSubChannel: ${REALTIME_REDIS_CHANNEL:him:rt:events}
    publishHttpUrl: ${REALTIME_HTTP_PUBLISH_URL:}
    publishHttpSecret: ${REALTIME_HTTP_PUBLISH_SECRET:}
    publishHttpTimeoutMs: ${REALTIME_HTTP_PUBLISH_TIMEOUT_MS:1500}

mojoauth:
  api-key: ${MOJOAUTH_API_KEY:}

twilio:
  accountSid: ${TWILIO_ACCOUNT_SID:}
  authToken: ${TWILIO_AUTH_TOKEN:}
  verifyServiceSid: ${TWILIO_VERIFY_SERVICE_SID:}

exotel:
  enabled: ${EXOTEL_ENABLED:false}
  apiKey: ${EXOTEL_API_KEY:}
  apiToken: ${EXOTEL_API_TOKEN:}
  accountSid: ${EXOTEL_ACCOUNT_SID:}
  subdomain: ${EXOTEL_SUBDOMAIN:api.exotel.com}
  from: ${EXOTEL_FROM:}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

zego:
  appId: ${ZEGO_APP_ID:}
  serverSecret: ${ZEGO_SERVER_SECRET:}
  callbackSecret: ${ZEGO_CALLBACK_SECRET:}
  tokenTtlSeconds: ${ZEGO_TOKEN_TTL_SECONDS:3600}
  recordApiBaseUrl: ${ZEGO_RECORD_API_BASE_URL:https://cloudrecord-api.zego.im}

firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:firebase-service-account.json}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${APP_ENV:dev}
  send-default-pii: ${SENTRY_SEND_DEFAULT_PII:false}
  logs:
    enabled: ${SENTRY_LOGS_ENABLED:true}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.05}
  profile-session-sample-rate: ${SENTRY_PROFILE_SESSION_SAMPLE_RATE:0.01}
  profile-lifecycle: ${SENTRY_PROFILE_LIFECYCLE:TRACE}

logging:
  level:
    org.springframework.security: INFO

ai:
  moderation:
    zenmux:
      api-key: ${ZENMUX_API_KEY:}
      endpoint: ${ZENMUX_ENDPOINT:https://zenmux.ai/api/v1/chat/completions}
      primary-model: ${ZENMUX_PRIMARY_MODEL:moonshotai/kimi-k3-free}
      fallback-model: ${ZENMUX_FALLBACK_MODEL:z-ai/glm-4.7-flash-free}
      timeout-seconds: ${ZENMUX_TIMEOUT_SECONDS:10}

